name: collect

on:
  schedule:
    # Every 3 hours.
    - cron: "15 */3 * * *"
    # Shortly before the Claude briefs at 08:45 and 18:45 UK time.
    # GitHub cron runs in UTC, so both the winter (GMT) and summer (BST) hours are listed.
    - cron: "15 7,8,17,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore previous data (cached gameweeks)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect
        id: collect
        run: |
          set +e
          python collector/collect.py data
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0

      - name: Publish to the data branch (history kept small by replacing it each run)
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Flag problems (GitHub emails you when this fails)
        if: steps.collect.outputs.code == '2'
        run: |
          python -c "import json; [print('PROBLEM:', p) for p in json.load(open('data/meta.json'))['problems']]"
          exit 1
